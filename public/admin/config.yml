# REDA FRAGRANCE — Configuration du panneau d’administration (Decap CMS)
# Ce panneau est servi par l’application : https://reda-fragrance.vercel.app/admin/
# Connexion : compte GitHub ayant accès en écriture au dépôt, via le relais
# /api/public/auth + /api/public/callback. Aucun secret n’est écrit ici :
# OAUTH_GITHUB_CLIENT_ID et OAUTH_GITHUB_CLIENT_SECRET vivent dans Vercel.
backend:
  name: github
  repo: bokhadronyahya-wq/reda-fragrance-luxe-site   # compte GitHub / nom du dépôt
  branch: main
  base_url: https://reda-fragrance.vercel.app
  auth_endpoint: api/public/auth
  commit_messages:
    create: "Ajout : {{slug}}"
    update: "Modification : {{slug}}"
    delete: "Suppression : {{slug}}"
    uploadMedia: "Image ajoutée : {{path}}"
    deleteMedia: "Image supprimée : {{path}}"

locale: fr
site_url: https://reda-fragrance.vercel.app
display_url: https://reda-fragrance.vercel.app
media_folder: public/images/uploads
public_folder: images/uploads

collections:
  - name: produits
    label: Produits
    label_singular: Produit
    description: "Ajoutez, modifiez, masquez ou supprimez vos produits."
    folder: public/site-autonome/content/produits
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: nom
    slug: "{{slug}}"
    summary: "{{nom}} — {{prix}} DH ({{categorie}})"
    sortable_fields: [nom, prix, categorie]
    view_filters:
      - { label: Parfums Femme, field: categorie, pattern: parfums-femme }
      - { label: Parfums Homme, field: categorie, pattern: parfums-homme }
      - { label: 10 ML Femme, field: categorie, pattern: 10ml-femme }
      - { label: 10 ML Homme, field: categorie, pattern: 10ml-homme }
      - { label: Cosmétiques, field: categorie, pattern: cosmetiques }
      - { label: Maquillage, field: categorie, pattern: maquillage }
      - { label: Épuisés, field: en_stock, pattern: false }
    fields:
      - { label: Nom, name: nom, widget: string }
      - { label: Marque, name: marque, widget: string, default: Reda Fragrance }
      - label: Catégorie
        name: categorie
        widget: select
        options:
          - { label: Parfums Femme, value: parfums-femme }
          - { label: Parfums Homme, value: parfums-homme }
          - { label: 10 ML Femme, value: 10ml-femme }
          - { label: 10 ML Homme, value: 10ml-homme }
          - { label: Cosmétiques, value: cosmetiques }
          - { label: Maquillage, value: maquillage }
      - { label: "Taille (ex. 100 ml)", name: taille, widget: string }
      - { label: Prix en DH, name: prix, widget: number, value_type: int, min: 0 }
      - { label: En stock, name: en_stock, widget: boolean, default: true }
      - { label: Quantité, name: quantite, widget: number, value_type: int, min: 0, default: 1 }
      - { label: "Vedette (affiché sur l’accueil)", name: vedette, widget: boolean, default: false }
      - { label: Nouveauté, name: nouveau, widget: boolean, default: false }
      - { label: "Visible sur le site (décochez pour masquer)", name: visible, widget: boolean, default: true }
      - { label: Description, name: description, widget: text }
      - { label: Notes olfactives (parfums), name: notes_olfactives, widget: string, required: false }
      - { label: Photo principale, name: image, widget: image, required: false }
      - label: Galerie (photos supplémentaires)
        name: galerie
        widget: list
        required: false
        field: { label: Photo, name: photo, widget: image }

  - name: reglages
    label: Réglages du site
    files:
      - name: reglages
        label: Textes, liens et images
        file: public/site-autonome/content/reglages.json
        fields:
          - { label: Titre « À propos », name: apropos_titre, widget: string }
          - { label: "Texte « À propos » (laissez une ligne vide entre deux paragraphes)", name: apropos_texte, widget: text }
          - { label: Introduction de la section Cosmétiques, name: cosmetiques_intro, widget: text }
          - { label: "Numéro WhatsApp au format international (ex. 212714103589)", name: whatsapp, widget: string, pattern: ["^[0-9]{9,15}$", "Chiffres uniquement, sans + ni espaces"] }
          - { label: Lien Instagram, name: instagram, widget: string }
          - { label: Bannière d’accueil (image large), name: image_hero, widget: image }
          - { label: Tuile « Parfums Femme », name: tuile_parfums_femme, widget: image }
          - { label: Tuile « Parfums Homme », name: tuile_parfums_homme, widget: image }
          - { label: Tuile « 10 ML Femme », name: tuile_10ml_femme, widget: image }
          - { label: Tuile « 10 ML Homme », name: tuile_10ml_homme, widget: image }
          - { label: Tuile « Cosmétiques », name: tuile_cosmetiques, widget: image }
          - { label: Tuile « Maquillage », name: tuile_maquillage, widget: image }
          - { label: Image « À propos », name: image_apropos, widget: image }
